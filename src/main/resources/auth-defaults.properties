# Fallback settings for the auth layer. Anything in application.properties overrides these.
#
# app.authn.type = basic | oauth2 | none   (default: basic)

# Test users for basic mode. Passwords need an encoder prefix: {noop}plain, {bcrypt}hash ...
# If you define app.authn.basic.users[...] in application.properties, define the whole list there.
app.authn.basic.users[0].username=viewer
app.authn.basic.users[0].password={noop}viewer123
app.authn.basic.users[0].name=Vera Viewer
app.authn.basic.users[0].email=viewer@example.com

app.authn.basic.users[1].username=editor
app.authn.basic.users[1].password={noop}editor123
app.authn.basic.users[1].name=Eddie Editor
app.authn.basic.users[1].email=editor@example.com
app.authn.basic.users[1].roles=EDITOR

app.authn.basic.users[2].username=admin
app.authn.basic.users[2].password={noop}admin123
app.authn.basic.users[2].name=Ada Admin
app.authn.basic.users[2].email=admin@example.com
app.authn.basic.users[2].roles=ADMIN

# Session cookie: Lax still allows the redirect back from an identity provider.
server.servlet.session.cookie.same-site=lax
