spring.application.name=yard-tracker
server.port=8080

# ---------------------------------------------------------------------------------------------
# SAFE DEFAULTS. This file is what runs when no profile is active, so everything here must be
# production-safe. Local conveniences (test users, H2 console, demo data) live in
# application-dev.properties, which `./gradlew bootRun` and `./gradlew test` switch on automatically.
# Production settings (database, identity provider) live in application-prod.properties.
#
# ProductionSafetyGuard refuses to start if an unsafe setting is on and app.security.dev-mode is not true.
# ---------------------------------------------------------------------------------------------

app.security.dev-mode=false

# Database: no default. Supply it per environment (see application-prod.properties).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Schema changes go through Flyway in production (src/main/resources/db/migration).
spring.flyway.enabled=false

# Never echo exception text to clients. GlobalExceptionHandler returns safe, readable messages.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Demo data is a local convenience only.
shipyard.demo-user=system
shipyard.seed-demo-data=false

# Authentication: oauth2 in production. basic and none are refused unless app.security.dev-mode=true.
app.authn.type=oauth2

# Everyone must hold VIEWER, EDITOR or ADMIN to see anything. Signing in alone is not enough.
app.authz.require-viewer-role=true

# Only match roles by e-mail when the identity provider says the address is verified.
app.authz.oauth2.trust-unverified-email=false

# Brute-force protection for the local login (basic mode). Ignored in oauth2 mode.
app.security.login.max-failures-per-user=5
app.security.login.max-failures-per-ip=50
app.security.login.lockout-minutes=15

# Session cookie
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Behind Apache / a load balancer that terminates HTTPS
server.forward-headers-strategy=framework

# Response headers (see SecuritySupport). style-src needs 'unsafe-inline' because the map sets inline CSS variables.
app.security.content-security-policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'

# Request size limits
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
