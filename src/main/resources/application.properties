spring.application.name=yard-tracker
server.port=8080

# File-based H2 database: survives restarts. Delete the ./data folder to reset to seed data.
spring.datasource.url=jdbc:h2:file:./data/yard
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Return validation messages to the UI
server.error.include-message=always

# Stand-in for SSO until real authentication is added
shipyard.demo-user=demo.user
shipyard.seed-demo-data=true

# Authentication: basic (default, test logins in auth-defaults.properties) | oauth2 | none
# app.authn.type=basic
