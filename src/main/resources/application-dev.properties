# ---------------------------------------------------------------------------------------------
# LOCAL DEVELOPMENT ONLY. Switched on by `./gradlew bootRun` and `./gradlew test` (see build.gradle).
# Never activate this profile on a shared server: it enables test logins and the H2 console.
# ---------------------------------------------------------------------------------------------

app.security.dev-mode=true

# File-based H2 database: survives restarts. Delete the ./data folder to reset to seed data.
spring.datasource.url=jdbc:h2:file:./data/yard
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Admin-only H2 console. Gives full database access, including running code on the host.
spring.h2.console.enabled=true

shipyard.demo-user=demo.user
shipyard.seed-demo-data=true

# Local test logins. Plain-text passwords are only acceptable here.
app.authn.type=basic

app.authn.basic.users[0].username=viewer
app.authn.basic.users[0].password={noop}viewer123
app.authn.basic.users[0].name=Vera Viewer
app.authn.basic.users[0].email=viewer@example.com
app.authn.basic.users[0].roles=VIEWER

app.authn.basic.users[1].username=editor
app.authn.basic.users[1].password={noop}editor123
app.authn.basic.users[1].name=Eddie Editor
app.authn.basic.users[1].email=editor@example.com
app.authn.basic.users[1].roles=EDITOR

app.authn.basic.users[2].username=admin
app.authn.basic.users[2].password={noop}admin123
app.authn.basic.users[2].name=Ada Admin
app.authn.basic.users[2].email=admin@example.com
app.authn.basic.users[2].roles=ADMIN

# http://localhost has no TLS
server.servlet.session.cookie.secure=false
