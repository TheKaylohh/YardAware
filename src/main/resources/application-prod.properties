# ---------------------------------------------------------------------------------------------
# PRODUCTION. Activate with SPRING_PROFILES_ACTIVE=prod.
# Secrets come from environment variables (or your secret store); never commit real values.
# ---------------------------------------------------------------------------------------------

# PostgreSQL. Use an application user that can SELECT/INSERT/UPDATE but does not own the schema.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only checks that it matches.
spring.flyway.enabled=true
spring.flyway.user=${DB_MIGRATION_USER:${DB_USER}}
spring.flyway.password=${DB_MIGRATION_PASSWORD:${DB_PASSWORD}}
spring.jpa.hibernate.ddl-auto=validate

# Identity provider
app.authn.type=oauth2
spring.security.oauth2.client.registration.idp.client-id=${OIDC_CLIENT_ID}
spring.security.oauth2.client.registration.idp.client-secret=${OIDC_CLIENT_SECRET}
spring.security.oauth2.client.registration.idp.scope=openid,profile,email
spring.security.oauth2.client.provider.idp.issuer-uri=${OIDC_ISSUER_URI}

# Use a claim the user cannot change. Microsoft Entra ID: oid. Keycloak / most others: sub.
# preferred_username and email can be edited in some providers, which would let a user claim someone else's role.
app.authz.oauth2.username-claim=${OIDC_USERNAME_CLAIM:sub}

# Who may do what. Comma-separated values of the claim above (or verified e-mail addresses).
# Prefer replacing InMemoryRolesLookupService with a lookup against IdP groups / eLDAP.
app.authz.oauth2.memory.roles.viewer=${YARD_VIEWERS:}
app.authz.oauth2.memory.roles.editor=${YARD_EDITORS:}
app.authz.oauth2.memory.roles.admin=${YARD_ADMINS:}

logging.level.SECURITY_AUDIT=INFO
